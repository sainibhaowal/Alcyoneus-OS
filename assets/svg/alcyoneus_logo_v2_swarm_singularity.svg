<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Space Gradient -->
    <radialGradient id="bgV2" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="60%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#010205"/>
    </radialGradient>

    <!-- Hyper Pulse Gradients -->
    <linearGradient id="quantumElectric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#7b00ff"/>
    </linearGradient>

    <linearGradient id="plasmaMagenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <linearGradient id="goldPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="v2Glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b1"/>
      <feGaussianBlur stdDeviation="22" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coreFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="flare"/>
      <feMerge>
        <feMergeNode in="flare"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" rx="160" fill="url(#bgV2)"/>

  <!-- Neural Matrix Lattice Background -->
  <g stroke="rgba(0, 255, 255, 0.08)" stroke-width="1.2">
    <!-- Starburst Vectors -->
    <line x1="400" y1="50" x2="400" y2="750"/>
    <line x1="50" y1="400" x2="750" y2="400"/>
    <circle cx="400" cy="400" r="320" fill="none" stroke-dasharray="3 9"/>
    <circle cx="400" cy="400" r="240" fill="none" stroke-dasharray="2 6"/>
    <circle cx="400" cy="400" r="160" fill="none"/>
  </g>

  <!-- Interlocking Quantum Triquetra / Mobius Ring (Multi-Agent Swarm) -->
  <g filter="url(#v2Glow)">
    <!-- Loop 1: Top Apex Agent Ring -->
    <path d="M 400,120 C 560,120 620,380 480,480 C 380,550 250,420 330,300 C 370,240 400,120 400,120 Z"
          fill="none"
          stroke="url(#quantumElectric)"
          stroke-width="18"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Loop 2: Bottom-Right Agent Ring -->
    <path d="M 640,540 C 560,680 300,660 260,500 C 230,380 400,280 500,340 C 560,380 640,540 640,540 Z"
          fill="none"
          stroke="url(#plasmaMagenta)"
          stroke-width="18"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Loop 3: Bottom-Left Agent Ring -->
    <path d="M 160,540 C 160,380 380,240 500,360 C 580,440 450,620 330,580 C 260,560 160,540 160,540 Z"
          fill="none"
          stroke="url(#goldPulse)"
          stroke-width="18"
          stroke-linecap="round"
          opacity="0.85"/>
  </g>

  <!-- Central Super-Singularity Core Flare -->
  <circle cx="400" cy="400" r="45" fill="#ffffff" filter="url(#coreFlare)"/>
  <circle cx="400" cy="400" r="18" fill="#00ffff" filter="url(#v2Glow)"/>

  <!-- Swarm Agent Satellite Nodes -->
  <g filter="url(#v2Glow)">
    <circle cx="400" cy="140" r="12" fill="#00ffff" stroke="#ffffff" stroke-width="3"/>
    <circle cx="625" cy="530" r="12" fill="#ff007f" stroke="#ffffff" stroke-width="3"/>
    <circle cx="175" cy="530" r="12" fill="#7b00ff" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Orbital Data Particle Accents -->
  <circle cx="480" cy="260" r="4" fill="#ffffff"/>
  <circle cx="320" cy="260" r="4" fill="#ffffff"/>
  <circle cx="400" cy="580" r="5" fill="#00ffff"/>
</svg>
