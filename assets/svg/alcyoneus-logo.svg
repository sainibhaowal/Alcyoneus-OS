<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#05080E" />
      <stop offset="100%" stop-color="#020407" />
    </linearGradient>

    <!-- Gradients -->
    <linearGradient id="cyan-electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#0070F3" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <linearGradient id="titanium-solid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="shield-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#banner-bg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Subtle Blueprint Tech Matrix lines -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="260" y1="0" x2="260" y2="320" />
    <line x1="560" y1="0" x2="560" y2="320" />
    <line x1="860" y1="0" x2="860" y2="320" />
  </g>

  <!-- ==================== LEFT LOGO MARK (160x160 scaled) ==================== -->
  <g transform="translate(45, 30)">
    <!-- Ambient Blue Radiance -->
    <circle cx="130" cy="130" r="60" fill="#0070F3" opacity="0.28" filter="url(#core-glow)" />

    <!-- Outer Hex Armor Shield (Production Foundation) -->
    <!-- Left Half -->
    <path d="M 130 20
             L 30 75
             L 30 185
             L 130 240
             L 130 216
             L 52 172
             L 52 88
             L 130 45 Z"
          fill="url(#shield-slate)"
          stroke="#334155"
          stroke-width="1.2" />

    <!-- Right Half -->
    <path d="M 130 20
             L 230 75
             L 230 185
             L 130 240
             L 130 216
             L 208 172
             L 208 88
             L 130 45 Z"
          fill="url(#shield-slate)"
          stroke="#475569"
          stroke-width="1.2" />

    <!-- Hardened Anchor Pins -->
    <circle cx="130" cy="20" r="3" fill="#00F0FF" />
    <circle cx="30" cy="75" r="3" fill="#00F0FF" />
    <circle cx="30" cy="185" r="3" fill="#00F0FF" />
    <circle cx="130" cy="240" r="3" fill="#00F0FF" />
    <circle cx="230" cy="185" r="3" fill="#00F0FF" />
    <circle cx="230" cy="75" r="3" fill="#00F0FF" />

    <!-- Isometric 'A' Monogram Framework -->
    <!-- Left Wing Arc -->
    <path d="M 130 55
             L 60 190
             L 90 190
             L 112 144
             L 148 144
             L 130 110
             L 122 126
             L 100 126
             L 130 68 Z"
          fill="url(#cyan-electric)"
          filter="url(#badge-glow)" />

    <!-- Right Wing Solid -->
    <path d="M 130 55
             L 200 190
             L 170 190
             L 148 144
             L 112 144
             L 130 110
             L 138 126
             L 160 126
             L 130 68 Z"
          fill="url(#titanium-solid)" />

    <!-- Central Graph Nexus Kernel Core -->
    <polygon points="130,128 142,144 130,160 118,144" fill="#00F0FF" filter="url(#badge-glow)" />
    <circle cx="130" cy="144" r="3" fill="#FFFFFF" />

    <!-- Sub-Agent Bus Lines -->
    <line x1="95" y1="188" x2="118" y2="144" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
    <line x1="165" y1="188" x2="142" y2="144" stroke="#0070F3" stroke-width="2" stroke-linecap="round" />
    <line x1="130" y1="62" x2="130" y2="128" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />

    <circle cx="95" cy="188" r="4.5" fill="#0B1120" stroke="#00F0FF" stroke-width="1.8" />
    <circle cx="165" cy="188" r="4.5" fill="#0B1120" stroke="#0070F3" stroke-width="1.8" />
  </g>

  <!-- ==================== VERTICAL SEPARATOR ==================== -->
  <line x1="330" y1="50" x2="330" y2="270" stroke="#1E293B" stroke-width="2" />
  <circle cx="330" cy="160" r="4" fill="#00F0FF" opacity="0.6" />

  <!-- ==================== TYPOGRAPHY & BRAND IDENTITY ==================== -->
  <!-- Main Wordmark -->
  <g transform="translate(370, 0)">
    <!-- Primary Title "ALCYONEUS" -->
    <text x="0" y="132"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="68"
          font-weight="900"
          letter-spacing="5"
          fill="#FFFFFF">ALCYONEUS</text>

    <!-- OS Pill Badge -->
    <g transform="translate(485, 78)">
      <rect x="0" y="0" width="84" height="42" rx="8" fill="#0070F3" opacity="0.2" stroke="#00F0FF" stroke-width="1.8" filter="url(#badge-glow)" />
      <text x="42" y="28"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
            font-size="22"
            font-weight="900"
            letter-spacing="2"
            text-anchor="middle"
            fill="#00F0FF">OS</text>
    </g>

    <!-- SDK Pill Badge -->
    <g transform="translate(580, 78)">
      <rect x="0" y="0" width="88" height="42" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <text x="44" y="28"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
            font-size="20"
            font-weight="800"
            letter-spacing="2"
            text-anchor="middle"
            fill="#E2E8F0">SDK</text>
    </g>

    <!-- Subtitle / Architecture Descriptor -->
    <text x="3" y="178"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif"
          font-size="18"
          font-weight="600"
          letter-spacing="6"
          fill="#94A3B8">MULTI-AGENT OPERATING SYSTEM // KERNEL RUNTIME</text>

    <!-- Technical Feature Chips -->
    <g transform="translate(3, 212)">
      <!-- Chip 1: StateGraph Engine -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#10B981" />
        <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">GRAPH RUNTIME</text>
      </g>

      <!-- Chip 2: Production Grade -->
      <g transform="translate(178, 0)">
        <rect x="0" y="0" width="176" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#00F0FF" />
        <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">ENTERPRISE CORE</text>
      </g>

      <!-- Chip 3: MCP & A2A Ready -->
      <g transform="translate(364, 0)">
        <rect x="0" y="0" width="160" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#A855F7" />
        <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#CBD5E1">MCP + A2A READY</text>
      </g>

      <!-- Chip 4: v1.0.0 Stable -->
      <g transform="translate(534, 0)">
        <rect x="0" y="0" width="130" height="28" rx="6" fill="#0369A1" fill-opacity="0.25" stroke="#0284C7" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
        <text x="26" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#38BDF8">v1.0.0 STABLE</text>
      </g>
    </g>
  </g>
</svg>
