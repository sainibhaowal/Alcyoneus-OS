name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force version bump (patch, minor, major, or leave empty for auto-detect from commits)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "patch"
          - "minor"
          - "major"

concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # =========================================================================
  # PRE-RELEASE VERIFICATION
  # =========================================================================
  verify-build:
    name: 🔍 Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Clean Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  # =========================================================================
  # SEMANTIC RELEASE: TAG & GITHUB RELEASE PUBLISH
  # =========================================================================
  release:
    name: 🚀 Alcyoneus OS Release & Tagging
    needs: [verify-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Full Git History & Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Release Tools
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate Version & Generate Changelog
        id: release_step
        run: |
          if [ -n "${{ inputs.force_bump }}" ]; then
            semantic-release version --force ${{ inputs.force_bump }}
          else
            semantic-release version
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Alcyoneus OS Release to GitHub
        run: |
          semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
