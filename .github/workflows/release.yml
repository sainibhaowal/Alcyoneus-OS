name: Semantic Release

on:
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force version bump (patch, minor, major, or leave empty for auto-detect from commits)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - "patch"
          - "minor"
          - "major"
      publish_to_pypi:
        description: "Upload built package to PyPI (requires PYPI_API_TOKEN in repo secrets)"
        required: false
        default: true
        type: boolean

concurrency:
  group: semantic-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # =========================================================================
  # 1. PRE-RELEASE VERIFICATION
  # =========================================================================
  verify-build:
    name: 🔍 Pre-Release Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Clean Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  # =========================================================================
  # 2. SEMANTIC RELEASE: TAG & GITHUB RELEASE PUBLISH
  # =========================================================================
  release:
    name: 🚀 Alcyoneus OS Release & Tagging
    needs: [verify-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      released: ${{ steps.check_release.outputs.released }}
    steps:
      - name: Checkout Full Git History & Tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Release Tools
        run: |
          python -m pip install --upgrade pip
          pip install python-semantic-release build

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate Version & Generate Changelog
        id: release_step
        run: |
          if [ -n "${{ inputs.force_bump }}" ]; then
            semantic-release version --force ${{ inputs.force_bump }}
          else
            semantic-release version
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Alcyoneus OS Release to GitHub
        run: |
          semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check If New Version Released
        id: check_release
        run: echo "released=true" >> $GITHUB_OUTPUT

  # =========================================================================
  # 3. AUTOMATED PYPI PUBLISH (When token is configured)
  # =========================================================================
  pypi-publish:
    name: 📦 Publish Package to PyPI
    needs: [release]
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && inputs.publish_to_pypi }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Distribution Packages
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "$TWINE_PASSWORD" ]; then
            echo "🚀 Publishing built wheels and sdist to PyPI..."
            twine upload --skip-existing dist/*
          else
            echo "⚠️ PYPI_API_TOKEN secret not set in GitHub repository settings. Skipping PyPI upload."
            echo "👉 Add your PyPI token to Settings -> Secrets and variables -> Actions to enable 1-click PyPI publishing."
          fi
