name: 🐛 Bug Report
description: Report a bug or unexpected behavior in Alcyoneus OS
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible to help us reproduce and resolve it quickly.

  - type: input
    id: version
    attributes:
      label: Alcyoneus OS Version
      description: What version of Alcyoneus OS are you using? (e.g., v1.0.0)
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, LLM provider (e.g. Python 3.12, Ubuntu 24.04, Gemini / OpenAI)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide a minimal code snippet reproducing the problem.
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Traceback / Logs
      description: Full terminal output and stack trace.
      render: shell
