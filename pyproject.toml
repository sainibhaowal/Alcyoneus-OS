[tool.pytest.ini_options]
env = [
    "ENVIRONMENT=pytest",
]
testpaths = [
    "tests/",
]
filterwarnings = [
    "ignore::DeprecationWarning"
]
# Only collect tests from the tests directory
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Exclude other directories from test discovery
norecursedirs = [
    "normal_tests",
    "examples",
    "docs",
    ".git",
    ".tox",
    "dist",
    "build",
    "alcyoneus.egg-info",
    "__pycache__",
    ".venv"
]
addopts = [
    "--strict-markers",
    "-v"
]
markers = [
    "asyncio: mark test as async test",
    "integration: mark test as integration test requiring real databases",
    "slow: mark test as slow test that takes longer to run",
]

[tool.coverage.run]
source = ["alcyoneus"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "normal_tests/*",
    "examples/*",
    "docs/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest-env]
ENVIRONMENT = "pytest"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.1.5",
    "pytest-xdist>=3.8.0",
    "pytest-benchmark>=5.1.0",
    "hypothesis>=6.100.0",
    "pre-commit>=3.8.0",
    "mypy>=1.11.0",
    "types-PyYAML",
    "asyncpg>=0.30.0",
    "redis>=6.4.0",
    "fastmcp>=2.12.3",
    "mcp>=1.14.1",
    "mem0ai>=0.1.117",
    "google-genai>=1.56.0",
    "a2a_sdk",
    "aiohttp",
    "python-semantic-release>=9.8.0"
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
build_command = "pip install build && python -m build"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "style",
    "refactor",
    "test"
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]

