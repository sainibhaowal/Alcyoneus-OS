[project]
name = "alcyoneus"
version = "1.1.0"
description = "Alcyoneus OS: Production-grade Python operating system & framework for building, orchestrating, and deploying multi-agent LLM systems."
readme = "README.md"
keywords = [
    "agent",
    "agents",
    "ai-agent",
    "ai-agents",
    "multi-agent",
    "multi-agent-systems",
    "agentic",
    "agentic-ai",
    "agentic-workflow",
    "agent-framework",
    "agent-orchestration",
    "orchestration",
    "workflow",
    "workflow-engine",
    "state-machine",
    "stategraph",
    "graph",
    "llm",
    "llm-agent",
    "llm-framework",
    "llm-orchestration",
    "llmops",
    "genai",
    "generative-ai",
    "ai",
    "artificial-intelligence",
    "openai",
    "anthropic",
    "claude",
    "gemini",
    "google-genai",
    "mcp",
    "model-context-protocol",
    "tool-use",
    "function-calling",
    "rag",
    "memory",
    "vector-store",
    "qdrant",
    "mem0",
    "alcyoneus",
    "alcyoneus-os",
    "alcyoneus-sdk",
    "sandboxing",
    "voice-pipeline",
    "guardrails",
    "pydantic-ai",
    "fastapi",
    "react-agent",
    "reasoning",
    "chatbot",
    "assistant",
    "a2a",
]
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "injectq>=0.4.0",
    "pillow>=12.2.0",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]
authors = [
    {name = "Alcyoneus Authors", email = "contact@alcyoneus.ai"}
]
maintainers = [
    {name = "Ravinder Singh", email = "contact@alcyoneus.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[project.urls]
Homepage = "https://alcyoneus.alcyoneus.ai"
Repository = "https://github.com/alcyoneus-os/alcyoneus"
Issues = "https://github.com/alcyoneus-os/alcyoneus/issues"
Documentation = "https://alcyoneus.alcyoneus.ai"


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
alc = "alcyoneus.cli:cli"

[project.optional-dependencies]
google-genai = ["google-genai>=1.56.0"]
realtime = ["google-genai>=1.56.0"]
openai = ["openai>=1.77.0"]
pg_checkpoint = ["asyncpg>=0.29.0","redis>=4.2"]
mcp = ["fastmcp>=2.11.3","mcp>=1.13.0"]
images = ["Pillow>=10.0.0"]
cloud-storage = ["cloud-storage-manager>=0.1.2"]
redis = ["redis>=4.2"]
kafka = ["aiokafka>=0.8.0"]
rabbitmq = ["aio-pika>=9.0.0"]
qdrant = ["qdrant-client>=1.7.0"]
mem0 = ["mem0ai>=0.1.117"]
a2a_sdk = ["a2a-sdk>=0.2.7", "httpx>=0.27.0", "uvicorn>=0.30.0", "sse-starlette>=2.0"]
browser = ["playwright>=1.50.0"]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
cli = ["click>=8.1.0", "rich>=13.0.0", "pyyaml>=6.0"]

all_publishers = [
    "redis>=4.2",
    "aiokafka>=0.8.0",
    "aio-pika>=9.0.0",
]

[tool.setuptools.packages.find]
include = ["alcyoneus*"]
exclude = ["normal_tests*", "tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
alcyoneus = ["py.typed"]


[tool.ruff]
line-length = 100
target-version = "py312"
lint.fixable = ["ALL"]
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
]
lint.ignore = [
    "B904",
    "B008",
    "S101",
    "S105",
    "S106",
    "S107",
    "S310",
    "S608",
    "E501",
]
# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
exclude = [
    "migrations/*",  # Exclude the migrations folder
    "venv/*",
    "example/*",
    "tests/*",
    "docs/*",
]


[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"bin/*.py" = ["E402", "S603", "T201", "S101"]
"*/tests/*.py" = ["E402", "S603", "T201", "S101", "PLR2004"]
"*/test/*.py" = ["E402", "S603", "T201", "S101"]
"scripts/*.py" = ["E402", "S603", "T201", "S101", "INP001"]
"*/__init__.py" = ["E402", "S603", "T201", "S101"]
"*/migrations/*.py" = ["E402", "S603", "T201", "S101"]
"examples/*" = [
    "E402", "E501", "E721", "S101", "T201",
    "PLC0415", "INP001", "PLR2004", "PTH100", "PTH105", "PTH108", "PTH110", "PTH118", "PTH120",
    "SIM102", "SIM108", "SIM115", "TID252", "UP042", "RUF002", "RUF003", "RUF100"
]
"alcyoneus/utils/interactive.py" = ["T201"]
"alcyoneus/storage/checkpointer/conformance/*" = ["S101"]
"alcyoneus/adapters/llm/openai_converter.py" = ["PLR0912"]
"alcyoneus/adapters/llm/openai_responses_converter.py" = ["PLR0912", "PLR0915"]
"alcyoneus/graph/agent.py" = ["PLR0912", "PLR0913"]
"alcyoneus/runtime/publisher/otel_publisher.py" = ["PLR0912"]
"alcyoneus/qa/evaluation/reporters/_html_css.py" = ["E501"]
"alcyoneus/qa/evaluation/reporters/_html_js.py" = ["E501"]
"alcyoneus/qa/evaluation/reporters/_html_template.py" = ["E501", "PLR0913"]
"alcyoneus/qa/evaluation/reporters/_html_render.py" = ["PLR0912"]


"alcyoneus/storage/sessions/*" = ["PLC0415", "E402", "E501"]
"alcyoneus/storage/store/embedding/*" = ["PLC0415", "E402", "E501"]
"alcyoneus/storage/store/qdrant_store.py" = ["PLC0415", "E402", "E501"]
"alcyoneus/storage/store/long_term_memory.py" = ["PLC0415", "E402", "E501"]
"alcyoneus/storage/store/memory_config.py" = ["PLC0415", "E402", "E501"]
"alcyoneus/storage/persistent_dict.py" = ["PTH105", "PTH110", "PTH108"]
"alcyoneus/utils/callbacks.py" = ["PLC0415", "E402"]
"alcyoneus/utils/schema.py" = ["PLC0415", "E402"]
"alcyoneus/utils/constants.py" = ["UP042"]
"alcyoneus/utils/id_generator.py" = ["UP042"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["src"]
[tool.ruff.lint.pylint]
max-args = 10
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["*/tests/*", "*/migrations", "*/scripts/*", "docs/*", "examples/*"]
skips = ["B101", "B611", "B601", "B608", "B102", "B307", "B405"]


[tool.ruff.lint.pydocstyle]
convention = "google"


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
exclude = [
    "normal_tests/*",
    "tests/*",
    "examples/*",
    "docs/*",
]

# Phased adoption: mypy was wired into CI after the codebase already existed, so
# it does not block on the modules that still carry pre-existing type errors.
# These are still parsed (so downstream type info is available) but their own
# errors are silenced. Burn the list down by cleaning a module's types and
# deleting its entry here; everything NOT listed is already gating.
[[tool.mypy.overrides]]
